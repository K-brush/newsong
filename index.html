<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEW SONG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Nanum+Myeongjo:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5efe2;--ink:#1c1a17;--sub:#6b635a;--line:#d9cfbb;--seal:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1916;--ink:#ece4d4;--sub:#a99f90;--line:#3a352e;--seal:#d9443a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1916;--ink:#ece4d4;--sub:#a99f90;--line:#3a352e;--seal:#d9443a;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond","Nanum Myeongjo",Georgia,serif;display:flex;align-items:center;justify-content:center;padding:32px 20px}
main{max-width:560px;width:100%;text-align:center}
.bar{width:44px;height:3px;background:var(--seal);margin:0 auto 32px}
h1{font-size:clamp(44px,13vw,84px);font-weight:700;letter-spacing:.14em;margin:0 0 14px;padding-left:.14em;line-height:1.1}
.sub{font-style:italic;font-weight:500;color:var(--sub);font-size:clamp(20px,5vw,26px);letter-spacing:.06em;margin:0 0 44px}
.skip{display:inline-block;padding:10px 4px;color:var(--ink);font-size:19px;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
.skip:hover,.skip:focus-visible{border-color:var(--seal);outline:none}
</style>
</head>
<body>
<main>
  <div class="bar" aria-hidden="true"></div>
  <h1>NEW SONG</h1>
  <p class="sub">rewritten hymn</p>
  <a class="skip" href="https://app.notion.com/p/k-brush/39606fc3f79c80dd95bcfe6475968c6f">Read the lyrics →</a>
</main>
<script>
var u="https://app.notion.com/p/k-brush/39606fc3f79c80dd95bcfe6475968c6f";
var top_level=false;
try{top_level=(window.top===window.self);}catch(e){}
if(top_level&&!/KAKAOTALK/i.test(navigator.userAgent)){setTimeout(function(){window.location.href=u;},2500);}
</script>
</body>
</html>
